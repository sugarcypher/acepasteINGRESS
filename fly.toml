# fly deploy  (after: fly launch --no-deploy to create the app + volume)
app = "acepaste-ingress"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  INGRESS_SANDBOX = "off"
  INGRESS_RECEIPTS_FILE = "/data/receipts.jsonl"
  INGRESS_RETENTION_DAYS = "30"

[[mounts]]
  source = "ingress_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Secrets (set once, never in this file):
#   fly secrets set INGRESS_SIGNING_KEY=<random 32+ chars>
#   fly secrets set INGRESS_KEYS="<key1>:design-partner-a,<key2>:design-partner-b"
# Leave INGRESS_KEYS unset only for a throwaway open demo.
