# fly.toml app configuration file generated for acepaste-ingress on 2026-11-01T14:33:19-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'acepaste-ingress'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  INGRESS_FEED_FILE = '/data/feed.jsonl'
  INGRESS_RECEIPTS_FILE = '/data/receipts.jsonl'
  INGRESS_RETENTION_DAYS = '30'
  INGRESS_SANDBOX = 'off'
  PORT = '8787'

[[mounts]]
  source = 'ingress_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
